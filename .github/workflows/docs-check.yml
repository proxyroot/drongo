name: Docs check

# Validate the docs build (strict) on pull requests. The Docs workflow only
# deploys on release, so this keeps broken nav / links / references from landing
# on main between releases.
on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs*.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Strict build
        run: uvx --with mkdocs-material mkdocs build --strict
