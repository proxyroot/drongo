name: Release

# Publishes to PyPI via Trusted Publishing (OIDC) when a GitHub Release is
# published (typically by the owner publishing the draft that Release Drafter
# maintains). No API tokens required - configure a trusted publisher for this
# repo at https://pypi.org/manage/account/publishing/
#
# Triggering only on `release: published` (not on tag pushes) avoids a
# double publish, since publishing a release also creates its tag.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags needed for hatch-vcs version
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build sdist + wheel
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/drongo
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
