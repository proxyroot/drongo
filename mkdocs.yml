site_name: drongo
site_description: Mock Google Cloud Platform services in your tests. The moto for GCP.
site_url: https://drongo.proxyroot.com
repo_url: https://github.com/proxyroot/drongo
repo_name: proxyroot/drongo
edit_uri: edit/main/docs/
copyright: Apache-2.0

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

# Version selector, powered by mike (deployed on release, see .github/workflows/docs.yml).
extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Supported services: supported-services.md
  - Services:
      - Cloud Storage: services/storage.md
      - Secret Manager: services/secret-manager.md
      - Pub/Sub: services/pubsub.md
      - BigQuery: services/bigquery.md
      - Cloud Tasks: services/cloud-tasks.md
      - Cloud Run Jobs: services/cloud-run-jobs.md
      - Resource Manager: services/resource-manager.md
      - Firestore: services/firestore.md
      - IAM & Service Accounts: services/iam.md
      - Cloud Logging: services/cloud-logging.md
      - Cloud KMS: services/cloud-kms.md
      - Cloud Scheduler: services/cloud-scheduler.md
      - Cloud Functions: services/cloud-functions.md
      - Memorystore (Redis): services/memorystore.md
  - Executable handlers: executable-handlers.md
  - Generating data: seeding.md
  - Standalone server: server.md
  - Architecture: architecture.md
  - Roadmap: roadmap.md
  - Contributing a service: contributing-a-service.md
