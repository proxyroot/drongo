[build-system]
requires = ["hatchling>=1.21", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "drongo"
dynamic = ["version"]
description = "Mock Google Cloud Platform services in your tests - the moto for GCP."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "The drongo contributors" }]
keywords = [
    "gcp",
    "google-cloud",
    "mock",
    "testing",
    "stub",
    "fake",
    "moto",
    "pytest",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing :: Mocking",
    "Typing :: Typed",
]
dependencies = [
    "responses>=0.25",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/proxyroot/drongo"
Documentation = "https://github.com/proxyroot/drongo#readme"
Repository = "https://github.com/proxyroot/drongo"
Issues = "https://github.com/proxyroot/drongo/issues"
Changelog = "https://github.com/proxyroot/drongo/releases"

# The google-cloud client libraries are *not* runtime dependencies: drongo mocks
# them, so users bring their own. They are only needed to run drongo's own tests.
[project.optional-dependencies]
# Optional: fake-data generators in `drongo.seed`.
faker = ["faker>=20"]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "google-cloud-storage>=2.14",
    "google-cloud-secret-manager>=2.16",
    "google-cloud-pubsub>=2.18",
    "google-cloud-bigquery>=3.11",
    "google-cloud-tasks>=2.13",
    "google-cloud-run>=0.10",
    "google-cloud-resource-manager>=1.10",
    "google-cloud-firestore>=2.11",
    "google-cloud-iam>=2.12",
    "google-cloud-logging>=3.5",
    "google-cloud-kms>=2.19",
    "google-cloud-scheduler>=2.11",
    "google-cloud-functions>=1.13",
    "faker>=20",
]
dev = [
    "drongo[test]",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.5",
    "types-requests",
]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
drongo = "drongo.cli:main"

# Registers drongo's pytest fixtures automatically when pytest is installed.
[project.entry-points.pytest11]
drongo = "drongo.pytest_plugin"

# The version is derived from the latest git tag by hatch-vcs, so there is
# nothing to bump by hand: tag `vX.Y.Z` and the build is `X.Y.Z`.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/drongo/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/drongo"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/CHANGELOG.md", "/README.md", "/LICENSE"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
]
ignore = [
    "B904", # allow raising without `from` inside except (error mapping helpers)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
# Strong, but not maximal: full "strict" fights the untyped google client
# libraries drongo has to poke at. These flags keep real value on drongo's own code.
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["responses.*", "google.*", "google_crc32c.*", "grpc", "grpc.*", "faker", "faker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# Turn drongo's own warnings into errors, but tolerate the deprecation noise the
# google client libraries are known to emit.
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::ResourceWarning",
    "ignore::ImportWarning",
    # google.api_core nags (FutureWarning) about Python 3.10's upcoming EOL on
    # import; harmless for tests and out of our control.
    "ignore:You are using a Python version:FutureWarning",
]

[tool.coverage.run]
source = ["drongo"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]